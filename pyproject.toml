[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoAlphaFold2"
version = "0.1.0"
description = "A compact, educational implementation of AlphaFold 2"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nanoAlphaFold2 contributors" }]
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
notebooks = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
]
data = [
  "requests>=2.31",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
]
all = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "requests>=2.31",
  "pytest>=8.0",
  "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
